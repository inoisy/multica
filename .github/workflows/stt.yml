# Fork-only checks and images for inoisy/multica. Upstream workflows stay
# untouched so upstream syncs merge cleanly; everything specific to this fork
# lives here.
name: STT

on:
  push:
    branches: [main]
    # Changes that do not alter the images must not rebuild them: a new image
    # tag makes the server redeploy and restart the backend for nothing.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/**"
      - "tools/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-signatures:
    # Commits must not carry AI attribution trailers (team rule).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: No AI signatures in PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Upstream commits arrive with their own trailers on every sync; only our commits are checked.
          git fetch --quiet https://github.com/multica-ai/multica.git main
          found=$(git log "$BASE..$HEAD" --not FETCH_HEAD --format='%h %B' | grep -iE '^(co-authored-by|claude-session):|generated with' || true)
          if [ -n "$found" ]; then
            echo "::error::AI signatures found in commit messages:"
            echo "$found"
            exit 1
          fi

  images:
    # Backend and web images for the self-hosted server, tagged with the commit.
    # The server pulls them; GitHub gets no access to production.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit date
        id: meta
        run: |
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          # Release tags live upstream; the fork shares their commits. The
          # git-describe shape (v0.7.1-239-g8c9066840) is what the server and
          # the web treat as a dev build, so quick create and other CLI version
          # gates accept our daemons. "main-<sha>" parsed as no version at all.
          # --long keeps the -N-g<sha> suffix on a tagged commit too: a bare
          # vX.Y.Z would make the daemon auto-update itself from upstream releases.
          git fetch --quiet --tags https://github.com/multica-ai/multica.git
          echo "version=$(git describe --tags --long --match 'v[0-9]*' --abbrev=9)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/multica-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/multica-${{ matrix.name }}:main
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
